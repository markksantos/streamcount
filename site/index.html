<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>streamcount</title>
<style>
  :root {
    --bg: #0b0d10; --fg: #f2f4f8; --dim: #6b7280; --card: #12151a;
  }
  * { margin: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--fg); min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: -apple-system, "SF Pro Display", "Inter", system-ui, sans-serif;
    gap: 2.5rem; padding: 2rem;
  }
  .label {
    text-transform: uppercase; letter-spacing: .35em; font-size: .75rem; color: var(--dim);
    display: flex; align-items: center; gap: .6em;
  }
  .label .dot {
    width: 8px; height: 8px; border-radius: 50%; background: #ef4444;
    animation: pulse 1.6s ease-in-out infinite;
  }
  .label .dot.off { background: #374151; animation: none; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .3 } }
  #total {
    font-size: clamp(5rem, 22vw, 13rem); font-weight: 700; line-height: 1;
    font-variant-numeric: tabular-nums; letter-spacing: -.03em;
  }
  .platforms { display: flex; flex-direction: column; gap: .4rem; width: min(22rem, 90vw); }
  .row {
    display: flex; align-items: center; gap: .75rem; padding: .65rem 1rem;
    background: var(--card); border-radius: .6rem; font-size: .95rem;
  }
  .row .pdot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .row .name { flex: 1; color: var(--fg); }
  .row .count { font-variant-numeric: tabular-nums; font-weight: 600; }
  .row.inactive { opacity: .38; }
  .row .note { font-size: .75rem; color: var(--dim); }
  .row.unknown { opacity: .9; outline: 1px solid rgba(239,68,68,.35); }
  .row.unknown .note { color: #ef4444; }
  #total.unknown { color: var(--dim); }
  #meta { font-size: .72rem; color: var(--dim); }
  #meta.stale { color: #b45309; }
  #health {
    display: flex; align-items: center; gap: .6em; font-size: .8rem;
    padding: .5rem .9rem; border-radius: 999px; background: var(--card); color: var(--dim);
    border: 1px solid transparent;
  }
  #health .hdot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; flex: none; }
  #health.warn { color: #f59e0b; border-color: rgba(245,158,11,.35); }
  #health.warn .hdot { background: #f59e0b; }
  #health.bad { color: #ef4444; border-color: rgba(239,68,68,.45); background: rgba(239,68,68,.08); }
  #health.bad .hdot { background: #ef4444; animation: pulse 1.2s ease-in-out infinite; }
</style>
</head>
<body>
  <div class="label"><span class="dot off" id="livedot"></span>watching now</div>
  <div id="total">–</div>
  <div class="platforms" id="platforms"></div>
  <div id="health"><span class="hdot"></span><span id="healthtext">loading…</span></div>
  <div id="meta"></div>
<script>
  const COLORS = { youtube: "#ff0033", twitch: "#9146ff", kick: "#53fc18", x: "#e7e9ea" };
  const NAMES = { youtube: "YouTube", twitch: "Twitch", kick: "Kick", x: "X" };
  const NOTES = {
    needs_keys: "needs API keys", unsupported: "no API yet", disabled: "not configured",
    offline: "offline", error: "unreachable", timeout: "timed out",
  };
  // "we could not ask" — never summed, never shown as zero.
  const UNKNOWN = new Set(["error", "timeout"]);
  const STALE_MS = 3 * 60 * 1000;

  function setHealth(level, text) {
    document.getElementById("health").className = level;
    document.getElementById("healthtext").textContent = text;
  }

  async function refresh() {
    try {
      const res = await fetch("./.herenow/data/stats?limit=1");
      const { records } = await res.json();
      if (!records || !records.length) return;
      const r = records[0];
      const d = r.data || {};
      const platforms = { ...(d.platforms || {}) };
      // Before the site is republished with the wider schema, the server
      // smuggles poller health through platforms._poller. Accept either.
      const poller = d.poller || platforms._poller || {};
      delete platforms._poller;
      const ts = r.updatedAt || r.updated_at;
      const ageMs = Date.now() - new Date(ts).getTime();
      // Two independent staleness signals: the record hasn't been pushed
      // (poller process dead), or the poller pushed but told us it's blind.
      const frozen = ageMs > STALE_MS;
      const totalKnown = d.total_known ?? poller.total_known;
      const blind = poller.stale === true || totalKnown === false;
      const stale = frozen || blind;

      const totalEl = document.getElementById("total");
      totalEl.className = stale ? "unknown" : "";
      totalEl.textContent = stale ? "?" : (d.total ?? 0).toLocaleString();

      const anyLive = !stale && Object.values(platforms).some(p => p.live);
      document.getElementById("livedot").className = "dot" + (anyLive ? "" : " off");

      const order = ["youtube", "twitch", "kick", "x"];
      document.getElementById("platforms").innerHTML = order
        .filter(k => platforms[k]).map(k => [k, platforms[k]]).map(([k, p]) => {
          const active = p.status === "ok" && p.live;
          const unknown = UNKNOWN.has(p.status);
          const right = active
            ? `<span class="count">${Number(p.viewers).toLocaleString()}</span>`
            : `<span class="note">${NOTES[p.status] || p.status}</span>`;
          const cls = active ? "" : unknown ? " unknown" : " inactive";
          return `<div class="row${cls}">
            <span class="pdot" style="background:${COLORS[k]}"></span>
            <span class="name">${NAMES[k]}</span>${right}</div>`;
        }).join("");

      const when = new Date(ts).toLocaleTimeString();
      if (frozen) {
        setHealth("bad", `POLLER DEAD — nothing pushed since ${when} (${Math.round(ageMs / 60000)} min ago). This is a dead poller, not an empty stream.`);
      } else if (blind) {
        setHealth("bad", `POLLER BLIND — ${poller.reason || "no platform could be reached"}. Numbers are not trustworthy.`);
      } else if (poller.status === "degraded") {
        setHealth("warn", `poller degraded — ${poller.reason || "some platforms unreachable"}`);
      } else {
        setHealth("", `poller ok — pushed ${when}`);
      }

      const meta = document.getElementById("meta");
      meta.textContent = stale ? `last update ${when}` : `updated ${when}`;
      meta.className = stale ? "stale" : "";
    } catch (e) { /* transient; keep last render */ }
  }
  refresh();
  setInterval(refresh, 30000);
</script>
</body>
</html>
