<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>streamcount overlay</title>
<style>
  body {
    margin: 0; background: transparent; overflow: hidden;
    font-family: -apple-system, "SF Pro Display", "Inter", system-ui, sans-serif;
    display: flex; align-items: center; gap: .45em; padding: .3em .5em;
    color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.6);
  }
  .dot { width: .55em; height: .55em; border-radius: 50%; background: #ef4444;
    animation: pulse 1.6s ease-in-out infinite; }
  /* Amber, not red: the count is unknown rather than zero. Never burn a
     confident number into a scene when the poller can't vouch for it. */
  .dot.unknown { background: #f59e0b; animation: none; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .3 } }
  #n { font-size: 2.4em; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
  #n.unknown { opacity: .55; }
</style>
</head>
<body>
  <span class="dot" id="d"></span><span id="n">–</span>
<script>
  let fails = 0;
  function show(text, unknown) {
    const n = document.getElementById("n");
    n.textContent = text;
    n.className = unknown ? "unknown" : "";
    document.getElementById("d").className = "dot" + (unknown ? " unknown" : "");
  }
  async function refresh() {
    try {
      const res = await fetch("/api/viewers", { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const s = await res.json();
      fails = 0;
      const bad = s.totalKnown === false || (s.poller && s.poller.stale);
      show(bad ? "?" : Number(s.total || 0).toLocaleString(), bad);
    } catch (e) {
      // Server gone. Freezing the last number is the failure that started all
      // of this — say "?" instead.
      if (++fails >= 2) show("?", true);
    }
  }
  refresh();
  setInterval(refresh, 5000);
</script>
</body>
</html>
